name: CI

on:
  push:
    branches: [main]
    tags: 'v*'
  pull_request:
  # Lets a publish be triggered by hand from the Actions tab, which is what you
  # need for the first push to nuget.org.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Coverage is kept in its own step so a failure in the instrumentation tool does not
      # change the test result.
      - name: Coverage
        run: dotnet test --configuration Release --no-build --
          --coverage
          --coverage-output-format cobertura
          --coverage-output ${{ github.workspace }}/coverage.cobertura.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.cobertura.xml

      - name: Pack
        run: dotnet pack --configuration Release --no-build

  # Publishing is separate from build-and-test so a packaging failure never marks a
  # normal push as failed. It runs on a version tag or a manual run, and needs the
  # NUGET_API_KEY repository secret (an API key with the Publish scope).
  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack --configuration Release

      - name: Publish
        run: dotnet nuget push **/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
